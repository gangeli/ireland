<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ireland Shortlist</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=20261005033139">
</head>
<body class="idx">

<div id="keybar" class="keybar" hidden>
  <form id="keyform" class="keybar-inner">
    <label for="keyinput">Google Maps browser key</label>
    <input id="keyinput" type="password" autocomplete="off" placeholder="AIza…" spellcheck="false">
    <button type="submit">Load maps</button>
    <span class="keybar-hint">Stored only in this browser.</span>
  </form>
</div>

<header class="idx-head">
  <h1><img src="favicon.svg" alt="" width="26" height="26">The shortlist <span class="idx-count" id="idx-count"></span></h1>
  <div class="idx-tools">
    <div class="seg" role="tablist" aria-label="View">
      <button type="button" role="tab" id="v-split" aria-selected="true">Both</button>
      <button type="button" role="tab" id="v-map" aria-selected="false">Map</button>
      <button type="button" role="tab" id="v-list" aria-selected="false">List</button>
    </div>
    <div class="idx-right">
    <label class="idx-who" for="idx-name">Rating as
      <input id="idx-name" list="idx-raters" placeholder="Your name" maxlength="40" size="12">
    </label>
    <datalist id="idx-raters"></datalist>
    <label class="sortby">Sort
      <select id="sort">
        <option value="rating">Our ratings</option>
        <option value="ai">AI rating</option>
        <option value="score">Best ledger</option>
        <option value="price">Price, low to high</option>
        <option value="added">Newest first</option>
        <option value="land">Most land</option>
      </select>
    </label>
    </div>
  </div>
</header>

<main class="idx-main wrap" id="idx-main" data-view="split">
  <div class="idx-map">
    <div id="idxmap" class="mapbox needs-key"><span>The map loads with a Maps key</span></div>
  </div>
  <ol class="idx-list" id="idx-list"></ol>
</main>


<script src="config.js?v=20261005033139"></script>
<script src="ratings.js?v=20261005033139"></script>
<script src="index.js?v=20261005033139"></script>
</body>
</html>
